<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ItsMynaX — Projects</title>

  <!-- Modern font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #071124; 
      --bg2: #0b1b2f;
      --glass: rgba(255, 255, 255, 0.04);
      --muted: #9fb0c9;
      --accent: #7ef3c3;
      --accent-2: #5bd0ff;
      --card-outline: rgba(255, 255, 255, 0.04);
      --radius: 14px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(1200px 600px at 10% 10%, rgba(101,73,255,0.09), transparent 5%),
                  radial-gradient(1000px 400px at 90% 80%, rgba(91,208,255,0.04), transparent 5%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      color: #e6f2ff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      width: min(1100px, 96%);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: 20px;
      padding: clamp(18px, 3.4vw, 36px);
      box-shadow: 0 10px 40px rgba(2,6,23,0.7);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(8px) saturate(120%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .profile {
      display: flex;
      gap: 18px;
      align-items: center;
      min-width: 0;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 18px;
      object-fit: cover;
      border: 1px solid var(--card-outline);
      box-shadow: 0 6px 22px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      flex-shrink: 0;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    .title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: auto;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #02202a;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(125,238,202,0.12);
      display: inline-flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-weight: 600;
    }

    /* Repos grid */
    .repos {
      margin-top: 20px;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    a.repo-link {
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--card-outline);
      transition: transform .28s cubic-bezier(.2,.9,.2,1), box-shadow .28s;
      transform-origin: center;
      will-change: transform;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      box-sizing: border-box;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 18px 50px rgba(2,6,23,0.6);
    }

    .card h3 {
      margin: 0;
      font-size: 15px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      min-height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-top: auto;
    }

    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      font-weight: 600;
    }

    .repo-stats {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 75%);
      background-size: 200% 100%;
      border-radius: 8px;
      min-height: 12px;
      animation: shimmer 1.5s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Responsive tweaks */
    @media (max-width: 640px) {
      .avatar { width: 72px; height: 72px; }
      .title h1 { font-size: 18px; }
      .repos { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .actions { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <div class="profile">
        <img class="avatar" id="avatar" src="https://avatars.githubusercontent.com/u/251846507?v=4" alt="ItsMynaX avatar" />
        <div class="title">
          <h1 id="username">ItsMynaX</h1>
          <p id="bio">Developer • tinkerer • tools &amp; system utilities — repos below are live from GitHub</p>
        </div>
      </div>

      <div class="actions">
        <a class="btn" id="visit" href="https://github.com/ItsMynaX" target="_blank" rel="noopener">
          View on GitHub
        </a>
        <button class="btn ghost" id="refresh">Refresh</button>
      </div>
    </header>

    <section aria-labelledby="projects" style="margin-top:18px">
      <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap">
        <h2 id="projects" style="margin:0;font-size:16px">Public repositories</h2>
        <div style="color:var(--muted);font-size:13px">Sorted by recent activity</div>
      </div>

      <div id="repos" class="repos" aria-live="polite" aria-busy="true" style="margin-top:12px">
        <!-- Skeleton placeholders -->
        <div class="card"><div class="skeleton" style="height:18px;width:60%"></div><div class="skeleton" style="height:12px;width:90%"></div><div style="display:flex;gap:8px;margin-top:auto"><div class="skeleton" style="height:24px;width:80px;border-radius:999px"></div></div></div>
        <div class="card"><div class="skeleton" style="height:18px;width:55%"></div><div class="skeleton" style="height:12px;width:80%"></div><div style="display:flex;gap:8px;margin-top:auto"><div class="skeleton" style="height:24px;width:80px;border-radius:999px"></div></div></div>
        <div class="card"><div class="skeleton" style="height:18px;width:45%"></div><div class="skeleton" style="height:12px;width:75%"></div><div style="display:flex;gap:8px;margin-top:auto"><div class="skeleton" style="height:24px;width:80px;border-radius:999px"></div></div></div>
      </div>
    </section>

    <footer>
      <div>Want this page published to GitHub Pages or styled differently? I can commit it for you — tell me which repo &amp; branch.</div>
      <div style="color:var(--muted)">Updated: <span id="last-updated">—</span></div>
    </footer>
  </main>

  <script>
    // Configuration
    const GH_USER = 'ItsMynaX';
    const PER_PAGE = 100;

    // Helpers
    const el = (selector) => document.querySelector(selector);
    const reposEl = el('#repos');
    const lastUpdatedEl = el('#last-updated');
    const avatarEl = el('#avatar');
    const usernameEl = el('#username');
    const bioEl = el('#bio');
    const refreshBtn = el('#refresh');

    async function fetchUser() {
      const r = await fetch(`https://api.github.com/users/${GH_USER}`);
      if (!r.ok) throw new Error('Failed to fetch user profile');
      return r.json();
    }

    async function fetchRepos() {
      const r = await fetch(`https://api.github.com/users/${GH_USER}/repos?per_page=${PER_PAGE}&sort=pushed`);
      if (!r.ok) throw new Error('Failed to fetch repositories');
      return r.json();
    }

    function timeAgo(dateStr) {
      if (!dateStr) return 'N/A';
      const d = new Date(dateStr);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (isNaN(diff)) return 'N/A';
      if (diff < 60) return Math.max(0, Math.floor(diff)) + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 2592000) return Math.floor(diff / 86400) + 'd ago';
      return d.toLocaleDateString();
    }

    function createRepoCard(repo) {
      const a = document.createElement('a');
      a.href = repo.html_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'repo-link';

      const card = document.createElement('article');
      card.className = 'card';
      if (repo.description) card.setAttribute('title', repo.description);

      const h3 = document.createElement('h3');
      h3.textContent = repo.name;

      const desc = document.createElement('p');
      desc.textContent = repo.description || 'No description provided';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const lang = document.createElement('span');
      lang.className = 'pill';
      lang.textContent = repo.language || '—';

      const dateSource = repo.pushed_at || repo.updated_at;
      const updated = document.createElement('span');
      updated.textContent = timeAgo(dateSource);
      if (dateSource) {
        updated.title = new Date(dateSource).toLocaleString();
      }

      const stats = document.createElement('div');
      stats.className = 'repo-stats';
      stats.innerHTML = `
        <span title="Stars">★ ${repo.stargazers_count ?? 0}</span>
        <span title="Forks">⎇ ${repo.forks_count ?? 0}</span>
      `;

      meta.appendChild(lang);
      meta.appendChild(updated);
      meta.appendChild(stats);

      card.appendChild(h3);
      card.appendChild(desc);
      card.appendChild(meta);

      a.appendChild(card);
      return a;
    }

    async function render() {
      reposEl.setAttribute('aria-busy', 'true');
      reposEl.innerHTML = '';
      
      try {
        const [user, repos] = await Promise.all([fetchUser(), fetchRepos()]);
        
        // Update user profile details
        if (user.avatar_url) avatarEl.src = user.avatar_url;
        if (user.login) usernameEl.textContent = user.login;
        if (user.bio) bioEl.textContent = user.bio;

        // Render repositories
        if (!Array.isArray(repos) || repos.length === 0) {
          const none = document.createElement('div');
          none.style.color = 'var(--muted)';
          none.style.padding = '18px';
          none.textContent = 'No public repositories found.';
          reposEl.appendChild(none);
        } else {
          // Additional fallback client-side sort by pushed_at date
          repos.sort((a, b) => new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at));
          
          for (const r of repos) {
            const card = createRepoCard(r);
            reposEl.appendChild(card);
          }
        }

        lastUpdatedEl.textContent = new Date().toLocaleString();
      } catch (err) {
        reposEl.innerHTML = '';
        const errNode = document.createElement('div');
        errNode.style.color = '#ff6b6b';
        errNode.style.padding = '14px';
        errNode.textContent = 'Could not load repositories. (Rate limit or network error)';
        reposEl.appendChild(errNode);
        console.error(err);
      } finally {
        reposEl.setAttribute('aria-busy', 'false');
      }
    }

    // Initial load
    render();

    // Refresh handler
    refreshBtn.addEventListener('click', () => {
      refreshBtn.textContent = 'Refreshing...';
      refreshBtn.disabled = true;
      render().finally(() => {
        refreshBtn.textContent = 'Refresh';
        refreshBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
